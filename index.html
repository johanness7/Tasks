<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.png">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Task Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        cardBg: '#131b2e',
                    }
                }
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #090d16;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            position: fixed;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        .scroll-container {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="flex flex-col justify-between max-w-md mx-auto p-4">

    <!-- Header -->
    <header class="pt-4 pb-3 flex items-center justify-between border-b border-white/5 flex-shrink-0">
        <div class="flex items-center space-x-2.5">
            <div class="w-3.5 h-3.5 rounded-full bg-indigo-500 shadow-lg shadow-indigo-500/50"></div>
            <h1 class="text-xl font-bold tracking-tight text-white">Tasks</h1>
        </div>
        <button onclick="clearAllCompleted()" class="text-xs text-gray-400 hover:text-white bg-cardBg px-3.5 py-2 rounded-xl border border-white/5 active:scale-95 transition">
            Erledigte löschen
        </button>
    </header>

    <!-- Main Lists (Scrollable) -->
    <main class="scroll-container flex-1 py-4 space-y-6">
        
        <!-- To Do Sektion -->
        <section class="space-y-3">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-xs font-bold tracking-wider text-indigo-400 uppercase">Noch zu tun</h2>
                <span id="todo-count" class="text-xs font-bold text-indigo-400 bg-indigo-500/10 px-2.5 py-0.5 rounded-full">0</span>
            </div>
            <div id="todo-list" class="space-y-3 min-h-[80px]">
                <!-- Dynamisch -->
            </div>
        </section>

        <!-- Erledigt Sektion -->
        <section class="space-y-3 pt-2">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-xs font-bold tracking-wider text-emerald-400 uppercase">Fertig</h2>
                <span id="done-count" class="text-xs font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-0.5 rounded-full">0</span>
            </div>
            <div id="done-list" class="space-y-3 min-h-[60px]">
                <!-- Dynamisch -->
            </div>
        </section>

    </main>

    <!-- Floating Plus Button -->
    <div class="fixed bottom-6 right-6 z-30">
        <button onclick="openModal()" class="w-16 h-16 rounded-full bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 text-white flex items-center justify-center shadow-lg shadow-indigo-600/40 active:scale-90 transition transform hover:scale-105 focus:outline-none">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path>
            </svg>
        </button>
    </div>

    <!-- Bottom Sheet Modal zum Hinzufügen -->
    <div id="task-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="modal-content" class="w-full max-w-md bg-cardBg border border-white/10 rounded-t-3xl p-6 shadow-2xl transform translate-y-full transition-transform duration-300 ease-out">
            <div class="w-12 h-1.5 bg-gray-700 rounded-full mx-auto mb-5"></div>
            <h3 class="text-lg font-semibold text-white mb-4">Neue Aufgabe</h3>
            <form onsubmit="addTask(event)" class="space-y-4">
                <input type="text" id="task-input" placeholder="Titel eingeben..." autocomplete="off" class="w-full bg-[#090d16] border border-white/10 rounded-2xl px-4 py-4 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 text-base shadow-inner">
                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="closeModal()" class="flex-1 py-3.5 bg-white/5 hover:bg-white/10 rounded-2xl text-base font-medium text-gray-300 active:scale-95 transition">Abbrechen</button>
                    <button type="submit" class="flex-1 py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-2xl text-base font-medium text-white shadow-md active:scale-95 transition">Hinzufügen</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logik -->
    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks_v4')) || [];

        function saveTasks() {
            localStorage.setItem('tasks_v4', JSON.stringify(tasks));
            renderTasks();
        }

        function openModal() {
            const modal = document.getElementById('task-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('pointer-events-none');
            modal.classList.add('opacity-100');
            content.classList.remove('translate-y-full');
            setTimeout(() => document.getElementById('task-input').focus(), 150);
        }

        function closeModal() {
            const modal = document.getElementById('task-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('opacity-100');
            content.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('pointer-events-none');
                document.getElementById('task-input').value = '';
            }, 300);
        }

        function addTask(e) {
            e.preventDefault();
            const input = document.getElementById('task-input');
            const title = input.value.trim();
            if (!title) return;

            tasks.unshift({
                id: Date.now().toString(),
                title: title,
                completed: false
            });

            saveTasks();
            closeModal();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            saveTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
        }

        function clearAllCompleted() {
            tasks = tasks.filter(t => !t.completed);
            saveTasks();
        }

        function renderTasks() {
            const todoList = document.getElementById('todo-list');
            const doneList = document.getElementById('done-list');
            const todoCount = document.getElementById('todo-count');
            const doneCount = document.getElementById('done-count');

            const todoTasks = tasks.filter(t => !t.completed);
            const doneTasks = tasks.filter(t => t.completed);

            todoCount.innerText = todoTasks.length;
            doneCount.innerText = doneTasks.length;

            todoList.innerHTML = todoTasks.length === 0 
                ? '<div class="text-center py-5 text-xs text-gray-500 bg-cardBg/40 border border-dashed border-white/5 rounded-2xl">Keine offenen Aufgaben</div>' 
                : '';

            doneList.innerHTML = doneTasks.length === 0 
                ? '<div class="text-center py-5 text-xs text-gray-500 bg-cardBg/40 border border-dashed border-white/5 rounded-2xl">Noch nichts erledigt</div>' 
                : '';

            todoTasks.forEach(task => {
                todoList.appendChild(createTaskElement(task));
            });

            doneTasks.forEach(task => {
                doneList.appendChild(createTaskElement(task));
            });
        }

        function createTaskElement(task) {
            const div = document.createElement('div');
            div.className = `bg-cardBg border border-white/5 rounded-2xl p-4 flex items-center justify-between shadow-sm transition ${task.completed ? 'opacity-60' : ''}`;
            
            div.innerHTML = `
                <div class="flex items-center space-x-3.5 flex-1 min-w-0 cursor-pointer pr-3" onclick="toggleTask('${task.id}')">
                    <div class="w-6 h-6 rounded-lg border-2 ${task.completed ? 'bg-emerald-500 border-emerald-500 flex items-center justify-center' : 'border-gray-500'} flex-shrink-0 transition">
                        ${task.completed ? '<svg class="w-4 h-4 text-black stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>' : ''}
                    </div>
                    <span class="text-base truncate ${task.completed ? 'line-through text-gray-400' : 'text-gray-100'}">${escapeHtml(task.title)}</span>
                </div>
                <div class="flex items-center space-x-2 flex-shrink-0">
                    <button onclick="toggleTask('${task.id}')" class="w-10 h-10 rounded-xl ${task.completed ? 'bg-amber-500/10 text-amber-400 hover:bg-amber-500/20' : 'bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20'} flex items-center justify-center transition active:scale-95" title="${task.completed ? 'Zurücksetzen' : 'Erledigen'}">
                        ${task.completed ? 
                            '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>' : 
                            '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>'
                        }
                    </button>
                    <button onclick="deleteTask('${task.id}')" class="w-10 h-10 rounded-xl bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 flex items-center justify-center transition active:scale-95" title="Löschen">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                </div>
            `;
            return div;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Init beim Start
        renderTasks();
    </script>
</body>
</html>
